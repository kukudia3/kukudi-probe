# 持续集成：每次 push / PR 跑一遍，外加每周一次的漏洞扫描。
#
# 为什么单独一个 workflow：release.yml 只在打 tag 时跑，而"能跑的检查"要天天跑。
# 权限只读（contents: read）且不引用任何凭据 ⇒ PR（含 fork 来的代码）拿不到写权限，
# 保持"不可信代码 + 写权限"绝不组合。
#
# release.yml 里的发布闸门跑 gofmt / vet / go test（不打 -race，让发布快一点）；
# 竞态检查放在这里 —— 合并到主干前就会红，不必等到打 tag。
#
# 为什么 go test 要拆成两条闸门（竞态检查 / e2e）：
#   internal/e2e 是浏览器端到端用例，光是不带 -race 单独跑就要 300+ 秒
#   （最重的单条 77 秒），-race 再慢 2~3 倍 ⇒ 必然撞上单包默认的 600 秒超时
#   （实测 `FAIL probe/internal/e2e 600.080s` / `panic: test timed out after 10m0s`）。
#   那条红【不是竞态】（日志里 WARNING: DATA RACE 计数 = 0），却长期把这一步拖红
#   ⇒ "这一步红了"变成没有信息量的噪声。所以：
#     · ① 竞态检查 `go test -race` 只跑真正并发的包（server / store / agent / alert …），
#          排除 internal/e2e —— 审计里 02-2 / 04-X-1 / 05-A-11 三条都在这些包上；
#     · ② internal/e2e 单独跑，不带 -race（与 release.yml 的发布闸门口径一致）。
#   两条闸门各自红就各自让 CI 红（没有 continue-on-error，没有跳过用例）；
#   而且 e2e 那一步带 always() ⇒ 竞态那一步红了也不会把它跳过（两条结论同一次 run 里都有）。
#
# 2026-10 又拆了一层：e2e 这【一个包】本身也拆成了 5 个测试包（+1 个装置包 harness）。
#   原因不是"跑得久"而是【余量】：整包 404.7 秒（本机；CI 331~354 秒）对单包默认
#   600 秒只剩 1.5 倍上下，而实测已经出现过"满载并行时的偶发超时"（详情页 canvas
#   轴标签、告警状态持久化 8 秒通知，单跑都是绿的）—— 撞线时红的是超时、不是代码。
#   拆包之后每个包各算各的 -timeout：一个包慢不会再把另一个包顶到线上。
#   ⚠️ 拆分把"排除 e2e"这件事变复杂了：下面竞态那一步的过滤模式必须从
#   '/internal/e2e$' 改成前缀 '/internal/e2e/'，否则新子包会被 -race 捞回来，
#   每条都撞 600 秒 —— 比拆之前更糟。deploy/deploy_test.go 里那两条守卫
#   （排除生效 / e2e 仍然单独跑）就是钉这件事的。
#
# 2026-10 第三次拆（这次拆的是"一个包里的用例"，对象是 internal/server）：
#   ★ 事实（本机实测，不是折算）：`ok probe/internal/server 654.564s`
#     —— 28 逻辑核、机器上没有别人在跑、全绿、`WARNING: DATA RACE` 0 处。
#     也就是说【这一个包自己就超过单包 600 秒】，与并行争用无关 ⇒ 调 `-p` 没用。
#     包内耗时极不均匀：最重的单条 TestMeasureOverviewPingIndexEffect 占 331.21 秒
#     （同一条不带 -race 12.99 秒 = 25.5 倍；它往 SQLite 里灌 691200 行、再对
#     8 天窗口连扫多轮，纯 Go 的 SQLite 引擎在 -race 下每个内存访问都要记账），
#     一条就占整包的一半；其余"测量型"用例（round3/4/5 那几个文件）合计约 145 秒，
#     而剩下的 390 多条用例加起来只有约 179 秒。
#   ⇒ 按 e2e 那次同一个办法：拆成 solo / heavy / rest 三组，每组各自一次 `go test`、
#     各算各的 -timeout。工作量一毫秒没减（三段合计 ≈ 655 秒 = 拆前那个包的总耗时），
#     只是把"一个 600 秒预算"换成"三个各自的 600 秒预算"。
#   ⚠️ 三段仍然都是 `-race -count=1 -timeout 10m`：没有放宽超时、没有跳过用例、
#     没有把 -race 缩小到一部分包。名单一致性由两处守卫钉住（CI 里用
#     `go test -list` 现算核对；deploy/deploy_test.go 里对着测试文件核对）。
#     这两处守卫的存在理由：名字对不上时 `-run` 会"命中 0 条用例且退出码 0"，
#     那就是"看着有分组、其实那一组什么都没跑" —— 比不拆更糟。
#
# 为什么要专门做"红得可读"：`go test -race` 是偶发的（同一个 commit 在 11 秒内
# 一红一绿），而默认的 step 日志未认证读不到（GET .../actions/jobs/{id}/logs → 403），
# 于是"红了"这件事本身没有可读性。所以失败时的详情要额外落到三条未认证可读的通道：
#   · $GITHUB_STEP_SUMMARY → job 摘要（写进去之后才可能有内容）
#   · ::error:: 注解       → annotations API（未认证可读）
#   · artifact             → artifacts 列表 API（未认证可读；下载要认证）
#
# 四个 Action 都固定到 commit SHA（后面注释是对应版本），dependabot 会提升级 PR。
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  schedule:
    # 每周一 03:17 UTC：上游新披露的依赖/标准库漏洞会在这一跑里被发现。
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # 工具链由仓库固定（go.mod 的 go 指令），不浮动：构建可复现。
          # 要跟进上游补丁版本就人工 bump go.mod（见 docs/SECURITY.md）。
          go-version-file: go.mod
          cache: false

      - name: 格式与静态检查
        id: static
        run: |
          set -eu
          test -z "$(gofmt -l .)" || { echo "gofmt 不干净"; gofmt -l .; exit 1; }
          go vet ./...
          GOOS=linux go vet ./...

      - name: 竞态检查（go test -race，排除 internal/e2e/...）
        id: race
        # 这一步只回答一个问题：服务端 / 存储 / Agent 有没有真的 data race。
        # internal/e2e/...（5 个测试包 + 装置包）被排除的原因见文件头：它的红是
        # "浏览器用例跑不过 -race 的慢"，不是竞态，却每次都用 600 秒默认超时
        # 把这一步拖红。
        # internal/server 【自己的用例】也拆了三组（见文件头"第三次拆"）：那一个包
        # 在 -race 下实测 654.564 秒 > 单包硬截断 600 秒，而且它是在【没有争用】
        # 的空闲机器上测出来的 ⇒ 那是这个包自己的结构问题，-p 调不出来。
        # 三组仍然各自 `-race -count=1 -timeout 10m`（超时一分没放宽、用例一条没跳过）。
        # ⚠️ `go test` 失败时会把 `--- FAIL: TestXxx` 和断言原文打印出来 ——
        # 别把它冲掉：tee 到 race-test.log，再由"测试失败详情"那一步送进摘要/注解/artifact。
        run: |
          set -eu
          set -o pipefail
          # ① 先取包列表：Go 没有 --exclude，所以用 go list 过滤。
          #    go list 失败、或过滤后一个包都不剩，都必须整体失败 ——
          #    否则会退化成"空列表 + go test 没有包可跑 + 退出码 0" = 永远绿。
          #    ⚠️ 模式是【前缀】'/internal/e2e/' 而不是结尾的 '/internal/e2e$'：
          #    2026-10 把 e2e 拆成了 5 个测试包 + 1 个装置包（见文件头的"为什么拆"），
          #    旧的 `$` 结尾写法现在只能匹配到……什么都匹配不到，新的子包会
          #    悄悄被 -race 捞回来，每条都撞自己的 600 秒 —— 比拆之前更糟。
          if ! pkgs="$(go list ./... | grep -v '/internal/e2e/')"; then
            echo "::error title=竞态检查前置失败::go list ./... 失败，或排除 internal/e2e 后没有剩下任何包 —— 不把「没有包可跑」当成通过"
            exit 1
          fi
          if [ -z "$pkgs" ]; then
            echo "::error title=竞态检查前置失败::包列表为空 —— 不把「没有包可跑」当成通过"
            exit 1
          fi
          # ② 排除不是"尽力而为"：过滤一旦失效（例如目录改名），当场红，
          #    绝不让 e2e 悄悄回到 -race 里、把那个 600 秒超时又拖回来。
          #    ⚠️ 命中时必须把【命中的包名】写进注解：step 日志是未认证 403 的
          #    （见文件头），注解是唯一带内容的通道。原来说"没生效"却不说"是哪个包"，
          #    v1.6.8 那次就被读成"过滤模式写错了" —— 真因是【e2e 拆包后忘了删顶层
          #    旧文件】留下的 probe/internal/e2e 本体：它的前缀不带结尾斜杠，
          #    所以 '/internal/e2e/' 这个子串过滤不到它，而它那 35 个旧文件 / 60 条
          #    旧用例正是 -race 下必然撞 600 秒的那批（同一个包在 e2e 那一步要 389 秒）。
          #    判据与退出码一字未改：还是"过滤之后的列表里不许再有 /internal/e2e"。
          if printf '%s\n' "$pkgs" | grep -q '/internal/e2e'; then
            offenders="$(printf '%s\n' "$pkgs" | grep '/internal/e2e' | tr '\n' ' ')"
            echo "::error title=竞态检查前置失败::排除 internal/e2e/... 没生效：包列表里仍然有 e2e 包 —— 命中：${offenders}（命中顶层 internal/e2e = 拆包后没删干净的旧包；只有子包命中 = 过滤模式写错）"
            exit 1
          fi
          printf '%s\n' "$pkgs" > race-packages.txt
          echo "参与 -race 的包 $(printf '%s\n' "$pkgs" | wc -l) 个（已排除 probe/internal/e2e/...：5 个测试包 + 装置包 harness）："
          printf '%s\n' "$pkgs"

          # ③ internal/server 的用例【不放这一趟里跑】，改成下面 ④ 的三组（各自一次 go test）。
          #    理由（本机实测，见文件头"第三次拆"）：它一个包在 -race 下就要 654.564 秒，
          #    而单包的 -timeout 是硬截断 600 秒 —— 与并行争用无关，-p 调不出来。
          server_pkg="$(go list ./internal/server)"
          if [ -z "$server_pkg" ]; then
            echo "::error title=竞态检查前置失败::go list ./internal/server 返回空 —— 这个包被删了或改名了"
            exit 1
          fi
          if ! printf '%s\n' "$pkgs" | grep -qxF "$server_pkg"; then
            echo "::error title=竞态检查前置失败::包列表里没有 $server_pkg —— 它被删了，或被上面的 e2e 过滤吃掉了"
            exit 1
          fi
          pkgs_others="$(printf '%s\n' "$pkgs" | grep -vxF "$server_pkg")"
          if [ -z "$pkgs_others" ]; then
            echo "::error title=竞态检查前置失败::摘掉 $server_pkg 之后一个包都不剩 —— 不把「没有包可跑」当成通过"
            exit 1
          fi
          echo "其中一次跑完的包 $(printf '%s\n' "$pkgs_others" | wc -l) 个："
          printf '%s\n' "$pkgs_others"

          # ④ internal/server 的三组名单 —— 这里是【唯一】的真相来源：下面两个 -run
          #    与一个 -skip 都从它生成，所以不会出现"某个名字谁也不跑"。
          #    · solo  —— 最重的单条：本机 -race 331.21 秒（同一条不带 -race 12.99 秒
          #       = 25.5 倍），一条就占整包的一半，必须独占一次调用。
          #    · heavy —— 其余"测量型"用例（往 SQLite 灌大数据再扫的那 5 个文件：
          #      round3_disk_measure_test.go / round4_measure_long_test.go /
          #      round4_measure_ping_test.go / round4_measure_stream_test.go /
          #      round5_traffic_measure_test.go）。本机 -race 合计约 145 秒，
          #      其中 TestPingDiskGrowthPerNodeHour 一条 69.7 秒（不带 -race 7.81 秒）。
          #      deploy/deploy_test.go 会核对"这 5 个文件里的每条用例都在名单里"：
          #      以后往这些文件里加用例而不更新名单，那条守卫会红。
          #    · rest  —— 该包其余全部用例（本机 -race 约 179 秒）。
          #    三段合计 ≈ 655 秒 = 拆之前那个包的总耗时：工作量一毫秒没减。
          solo='TestMeasureOverviewPingIndexEffect'
          heavy='TestPingDiskGrowthPerNodeHour|TestMeasureDispatcherLongScan|TestMeasureLatencyKneeOnLoopback|TestMeasureOverviewPingPayload60Nodes|TestMeasureOverviewPingPayloadSizeModel|TestMeasureStreamOutboundBytes|TestMeasureTrafficAgentFrameFieldAccounting|TestMeasureTrafficAgentUploadBytes|TestMeasureTrafficNewAgentOldServerFallback|TestMeasureTrafficStreamFrameFieldAccounting'
          expect_heavy=10

          # ⑤ 名单里的名字必须在包里真实存在（用 `go test -list` 现算，不写死）。
          #    不核的话，改名之后 `-run` 会命中 0 条用例并【退出码 0】——
          #    看着分组还在，其实那一组什么都没跑（比不拆更糟）。同一个 commit 里
          #    deploy/deploy_test.go 那条守卫也会对着测试文件再核一遍。
          got_solo="$(go test -race -list "^(${solo})$" "$server_pkg" | grep -cE '^Test' || true)"
          got_heavy="$(go test -race -list "^(${heavy})$" "$server_pkg" | grep -cE '^Test' || true)"
          if [ "${got_solo:-0}" != "1" ] || [ "${got_heavy:-0}" != "$expect_heavy" ]; then
            echo "::error title=竞态检查前置失败::internal/server 的重活名单对不上：solo 命中 ${got_solo:-0}（期望 1）、heavy 命中 ${got_heavy:-0}（期望 $expect_heavy）—— 用例改名/删除后必须同步 ci.yml 这段名单，否则分组静默失效"
            exit 1
          fi

          # ⑥ 四趟依次跑：一次跑完的那些包 + internal/server 的 heavy / solo / rest。
          #    一段红了【不跳过】另外几段 —— 原来的单次 go test 也是把结论一次报全的。
          #    pipefail 在上面已经打开：go test 一红这一段就红，tee 的退出码吃不掉它；
          #    tee 第一段截断、后面追加 ⇒ race-test.log 里四段齐全，失败详情那一步不用改。
          # ④/⑤/⑥ 合起来仍然满足"这条闸门就是竞态检查"：四趟都带 -race -count=1，
          #    -timeout 一律 10m（与 Go 的默认值相同，写出来只是让它可见），
          #    没有任何一趟被跳过或用例被排除。
          rc=0
          go test -race -count=1 -timeout 10m $pkgs_others 2>&1 | tee race-test.log || rc=1

          # 一组一次调用：先把组名写进日志（失败详情里能一眼看出红在哪一组），再跑 go test。
          run_group() {
            group="$1"; shift
            {
              echo "=== internal/server / $group：go test -race -count=1 -timeout 10m $* ==="
              go test -race -count=1 -timeout 10m "$@" 2>&1
            } 2>&1 | tee -a race-test.log
          }
          run_group heavy -run "^(${heavy})$" "$server_pkg" || rc=1
          run_group solo -run "^(${solo})$" "$server_pkg" || rc=1
          run_group rest -skip "^(${solo}|${heavy})$" "$server_pkg" || rc=1
          exit $rc

      - name: 端到端浏览器用例（internal/e2e/...，不带 -race）
        id: e2e
        # 与 release.yml 的发布闸门口径一致（那边是 `go test ./... -count=1`，同样不带 -race），
        # 唯一的差别是这里的 -timeout。所以它在同 commit 上应该也是绿的；
        # 如果它红，那是这几条浏览器用例真的 flaky，不是这一步写错了。
        # 关键：这一步红【一定】让 CI 红 —— 没有 continue-on-error、没有跳过用例、
        # 没有 -run 白名单、没有 `|| true`。拆分的目的是把 -race 用在该用的地方，
        # 不是把红灯藏起来。
        #
        # always() 是必须的，而且是被实测逼出来的：GitHub 默认"前面哪一步红了，后面没有 if 的
        # step 全跳过"——第一版拆分漏了这一点，结果 run 37107616463 里竞态那一步一红，
        # 这一步直接 skipped，"两条闸门各自出结论"变成了"一条红就把另一条吞掉"。
        # !cancelled()：整个 run 被取消时（concurrency 会把旧 run 顶掉）不白跑这一趟。
        # 前置 guard 跟漏洞扫描那一步同款并多一条 steps.static：源码没检出 / go 没就位 /
        # 格式与静态检查就没过时，跑浏览器用例没有意义（那时该先修静态问题）。
        # 注意这不等于"藏红灯"：这一步自己红了，job 照样红（它没有 continue-on-error）。
        if: always() && !cancelled() && steps.checkout.outcome == 'success' && steps.setup-go.outcome == 'success' && steps.static.outcome == 'success'
        # 2026-10 拆分：e2e 从"一个包 400+ 秒"变成 5 个测试包（protocol / chart /
        # identity / ui / flows，装置在 harness）。`./internal/e2e/...` 一条命令跑全部，
        # 而且【每个包各算各的 -timeout】—— 一个包慢不会再拖累另一个包撞线。
        # 拆前实测：整包 404.7 秒（本机）、CI 331~354 秒，而单包默认 600 秒，
        # 余量只剩 1.5 倍上下；拆后单包实测 40~130 秒（见下面的 -timeout 取值）。
        # 单条 `go test ./...` 一样能跑全（release.yml 就是这么跑的），
        # 这一步只是把 e2e 单独拎出来、好在失败详情里一眼看出是哪一片红的。
        #
        # -timeout 8m：拆前这里写的是 15m（因为整包 354 秒、默认 10 分钟余量不大）。
        # 拆后最慢的包本机约 130 秒，8 分钟 = 3.6 倍余量，比默认的 10 分钟更早
        # 把"真挂死"与"runner 抖动"分开；同时又明显高于 450 秒那条安全线
        # —— 任何一个包跑过 450 秒都该当回归查，而不是当正常波动。
        #
        # ⚠️ 这一步默认让 5 个包**并行**跑（`go test` 的 -p 默认 = CPU 数）：拆前同一时刻
        # 只有一个 Chrome，拆后最多 5 个。本机（28 逻辑核）实测并行只比单跑慢 5~10%，
        # 但**没有**在 4 vCPU 的 runner 上验证过。万一 CI 上"浏览器等待超时"变多，
        # 第一个该试的旋钮是 `-p 2`（或 -p 1 串行包），**不是**放宽 -timeout
        # —— 放宽只会把"真的卡住"也一起放过去。
        run: |
          set -o pipefail
          go test ./internal/e2e/... -count=1 -timeout 8m 2>&1 | tee e2e-test.log

      - name: 测试失败详情（哪条用例 / 哪个包 / 断言原文）
        # step 一红，后面默认的 run: 不会执行 ⇒ 必须显式 if:。
        # failure() 覆盖"前面任何一步红了"；cancelled() 让被取消/超时的 run 也留下现场。
        # 现在有【两条】go test 闸门（① 竞态检查 ② e2e），两条都可能红 ⇒ 两条日志都收，
        # 并用 steps.<id>.outcome 如实标出各自结论（只有一条红时不把另一条说成红；
        # 某一步没被调度时明说"没有日志"，不冒充结论）。
        #
        # 为什么是这个顺序：实测（run 37105610892 / 37106197824）三条通道里
        #   · check-run 的 output.summary/text 永远是 null ⇒ $GITHUB_STEP_SUMMARY 匿名读不到
        #   · artifact 列表匿名可读，但下载 zip 是 401 Requires authentication
        #   · 注解（annotations API / job 页 HTML）匿名可读 ✓
        # ⇒ 注解是唯一"带内容"的匿名通道，所以本文件的开头 200 行同时就是注解正文：
        #   两条闸门各自的结论、失败用例名、失败的包必须排在最前面，
        #   又长又啰嗦的调用栈 / 日志末尾排在后面。
        if: failure() || cancelled()
        env:
          # outcome 的取值只会是 success/failure/cancelled/skipped 之一，走 env 传进来
          # 是为了不在 run: 里内联表达式。
          RACE_OUTCOME: ${{ steps.race.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          out=test-failure-summary.txt

          # 一条日志的"关键数字"，给汇总行用。
          logline() {
            log="$1"
            if [ ! -f "$log" ]; then
              echo "没有日志（这一步没被调度，或红在它之前）"
              return 0
            fi
            fails=$(grep -cE '^--- FAIL|^[[:space:]]+--- FAIL' "$log" || true)
            races=$(grep -c 'WARNING: DATA RACE' "$log" || true)
            pkgs=$(grep '^FAIL[[:space:]]' "$log" | awk '{print $2}' | tr '\n' ' ' || true)
            names=$(grep -E '^--- FAIL|^[[:space:]]+--- FAIL' "$log" | sed -E 's/.*--- FAIL:[[:space:]]*//; s/[[:space:]]*\(.*\)$//' | tr '\n' ' ' || true)
            echo "日志 $(wc -l < "$log") 行；失败用例 ${fails:-0} 条〔${names:-无}〕；失败的包：${pkgs:-无}；竞态报告 ${races:-0} 处"
          }

          # 一条日志的完整详情段（[1] 用例/包/触发点 → [2] 各包结论 → [3] 日志末尾 → [4] 长块）。
          # 子编号用 [1]…[4]，避免和外层"① 竞态 / ② e2e"两道闸门的编号撞车。
          emit_section() {
            title="$1"; log="$2"; kind="$3"; outcome="$4"
            echo ""
            echo "### ${title}"
            echo ""
            echo "- 这一步的结论：${outcome:-未知}"
            if [ ! -f "$log" ]; then
              echo "这一步没有留下日志：失败发生在它之前（例如第 3 步 gofmt/vet 红了），或它被跳过/取消。"
              echo "本文件不含它的输出 —— 不要把这个空段读成「它通过了」。"
              return 0
            fi
            fails=$(grep -cE '^--- FAIL|^[[:space:]]+--- FAIL' "$log" || true)
            races=$(grep -c 'WARNING: DATA RACE' "$log" || true)
            pkgs=$(grep '^FAIL[[:space:]]' "$log" | awk '{print $2}' | tr '\n' ' ' || true)
            echo "- 原始日志 $(wc -l < "$log") 行；失败用例 ${fails:-0} 条；竞态报告 ${races:-0} 处；失败的包：${pkgs:-（没有包级 FAIL 行）}"
            # 这一行是给"到底是不是真竞态"这个第一问题用的：-race 红有两种完全不同的原因。
            # 只有"竞态这一步自己红了"才写这句 —— 它绿的时候写"这次红"是误导。
            if [ "${races:-0}" -gt 0 ]; then
              echo "- 竞态报告 ${races} 处 ⇒ 有真 data race（调用栈见 [4]）"
            elif [ "$kind" = race ] && [ "$outcome" = failure ]; then
              echo "- 竞态报告 0 处 ⇒ 这次红不是 data race，是这些包的用例自己失败/超时（-race 只是拖慢了机器）"
            fi
            echo "- 完整原文：artifact test-failure-logs（${log}）；本文件前 200 行即注解正文"
            echo ""
            echo "#### [1] 失败用例 / 失败的包 / 触发点（逐字摘自 go test 原文，带行号）"
            echo ""
            echo '```'
            # 说明：go test 打印的断言行是缩进的（"    xxx_test.go:88: ..."），
            # 所以 _test.go / testing.go 两个模式都允许前导空格。
            grep -nE '^--- FAIL|^[[:space:]]+--- FAIL|^WARNING: DATA RACE|^FAIL[[:space:]]|^[[:space:]]*[^[:space:]]+_test\.go:[0-9]+:|^[[:space:]]+testing\.go:[0-9]+:' "$log" | head -n 60 || true
            echo '```'
            echo ""
            echo "#### [2] 各包结论（哪几个包是 FAIL / ok）"
            echo ""
            echo '```'
            grep -E '^(FAIL|ok|\?)[[:space:]]' "$log" | head -n 40 || true
            echo '```'
            echo ""
            echo "#### [3] 原始日志末尾 40 行（收尾 / 兜底）"
            echo ""
            echo '```'
            tail -n 40 "$log"
            echo '```'
            echo ""
            echo "#### [4] 失败用例块 + 竞态报告块（含调用栈，可能较长）"
            echo ""
            echo '```'
            awk '
              /WARNING: DATA RACE/ { show = 45 }
              /^--- FAIL|^[[:space:]]+--- FAIL/ { show = 25 }
              show > 0 { print; show-- }
            ' "$log" | head -n 300
            echo '```'
          }

          {
            echo "## 测试失败详情（本 run 有两道 go test 闸门）"
            echo ""
            echo "- 提交：${GITHUB_SHA}（run ${GITHUB_RUN_ID} / 第 ${GITHUB_RUN_ATTEMPT} 次尝试）"
            echo "- ① 竞态检查（go test -race，排除 internal/e2e/...）：${RACE_OUTCOME:-未知}"
            echo "- ① 的日志：$(logline race-test.log)"
            if [ -f race-packages.txt ]; then
              if grep -q '/internal/e2e' race-packages.txt; then
                echo "- ⚠️ 参与 -race 的包列表里**仍然有** internal/e2e 子包：排除没生效，这条红可能又是 e2e 超时"
              else
                echo "- 参与 -race 的包 $(wc -l < race-packages.txt) 个（已确认其中没有 internal/e2e/... 的任何一个；列表在 race-packages.txt / artifact 里）"
              fi
            else
              echo "- race-packages.txt 不在：竞态那一步在取包列表之前就红了，或它没被调度"
            fi
            # internal/server 的用例拆成三组各跑一次（见竞态那一步的 ④）⇒ 日志里会出现
            # 三行 probe/internal/server 的结论。哪一组红，看它前面那行 `=== internal/server / <组名> ===`。
            echo "- internal/server 的用例分三组跑（heavy / solo / rest，各算各的 -timeout 10m）：日志里会有三行 probe/internal/server 结论，组名看 \`=== internal/server / … ===\` 标记"
            echo "- ② e2e 浏览器用例（go test ./internal/e2e/...，不带 -race，逐包 -timeout 8m）：${E2E_OUTCOME:-未知}"
            echo "- ② 的日志：$(logline e2e-test.log)"
            echo "- 全文：artifact test-failure-logs（race-test.log / e2e-test.log / race-packages.txt / 本文件）"
            emit_section "① 竞态检查（go test -race，排除 internal/e2e/...）" race-test.log race "${RACE_OUTCOME:-未知}"
            emit_section "② e2e 浏览器用例（go test ./internal/e2e/...，不带 -race，-timeout 8m）" e2e-test.log plain "${E2E_OUTCOME:-未知}"
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

          # 走注解通道：annotations API 与 job 页 HTML 都是未认证可读的（已实测）。
          # 换行必须转义成 %0A，否则 runner 只取第一行；% 要先转成 %25。
          # 200 行 ≈ 十几 KB，远低于"单条注解 65535 字符"的上限。
          cap=200
          msg="$(head -n "$cap" "$out" | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/\r/,""); if (NR>1) printf "%%0A"; printf "%s", $0}')"
          total=$(wc -l < "$out")
          if [ "$total" -gt "$cap" ]; then
            msg="${msg}%0A%0A（注解只含摘要前 ${cap} 行，全文共 ${total} 行；完整原文见 artifact test-failure-logs）"
          fi
          echo "::error title=测试失败详情（两道闸门：竞态检查 / e2e）::${msg}"

      - name: 上传测试失败日志（完整原文）
        # artifacts 列表（GET /repos/{o}/{r}/actions/runs/{id}/artifacts）未认证可读：
        # "有没有失败日志、叫什么名字"不登录也能确认（下载 zip 需要认证）。
        # 两条闸门的日志都上传，且各自的日志文件不重名 ⇒ 一眼能看出是哪一条红的。
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-failure-logs
          path: |
            race-test.log
            e2e-test.log
            race-packages.txt
            test-failure-summary.txt
          # 前面的步骤没留下文件时不要因为"没有文件"再红一次（详情缺失已经由注解说清了）。
          if-no-files-found: warn
          retention-days: 14

      - name: 漏洞扫描（依赖 + 标准库）
        # always()：这道闸门不该因为前一步红了就被跳过 —— 之前 14 个红 run 里它全是
        # skipped，等于发布版上从没真正跑过安全扫描。
        # 但不是无条件跑：checkout 失败时没有源码可扫，setup-go 失败时没有 go 可用，
        # 硬跑只会把无关报错混进结论（那才是误报）。所以钉住这两个前置条件都成功。
        if: always() && steps.checkout.outcome == 'success' && steps.setup-go.outcome == 'success'
        # 版本钉住以保证可复现；漏洞库运行时从 vuln.go.dev 取，新条目照样能发现。
        # 本地等价命令：make vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
