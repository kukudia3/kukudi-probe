# 持续集成：每次 push / PR 跑一遍，外加每周一次的漏洞扫描。
#
# 为什么单独一个 workflow：release.yml 只在打 tag 时跑，而"能跑的检查"要天天跑。
# 权限只读（contents: read）且不引用任何凭据 ⇒ PR（含 fork 来的代码）拿不到写权限，
# 保持"不可信代码 + 写权限"绝不组合。
#
# release.yml 里的发布闸门跑 gofmt / vet / go test（不打 -race，让发布快一点）；
# 竞态检查放在这里 —— 合并到主干前就会红，不必等到打 tag。
#
# 为什么要专门做"红得可读"：`go test -race` 是偶发的（同一个 commit 在 11 秒内
# 一红一绿），而默认的 step 日志未认证读不到（GET .../actions/jobs/{id}/logs → 403），
# 于是"红了"这件事本身没有可读性。所以失败时的详情要额外落到三条未认证可读的通道：
#   · $GITHUB_STEP_SUMMARY → job 摘要（写进去之后才可能有内容）
#   · ::error:: 注解       → annotations API（未认证可读）
#   · artifact             → artifacts 列表 API（未认证可读；下载要认证）
#
# 四个 Action 都固定到 commit SHA（后面注释是对应版本），dependabot 会提升级 PR。
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  schedule:
    # 每周一 03:17 UTC：上游新披露的依赖/标准库漏洞会在这一跑里被发现。
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # 工具链由仓库固定（go.mod 的 go 指令），不浮动：构建可复现。
          # 要跟进上游补丁版本就人工 bump go.mod（见 docs/SECURITY.md）。
          go-version-file: go.mod
          cache: false

      - name: 格式与静态检查
        run: |
          set -eu
          test -z "$(gofmt -l .)" || { echo "gofmt 不干净"; gofmt -l .; exit 1; }
          go vet ./...
          GOOS=linux go vet ./...

      - name: 单元测试 + 竞态检查
        id: race
        # `go test` 失败时会把 `--- FAIL: TestXxx` 和断言原文打印出来 ——
        # 这次改动的全部意义就是别把它冲掉：tee 到 race-test.log，再由下一步送进
        # 摘要 / 注解 / artifact。
        # ⚠️ set -o pipefail：不加的话管道的退出码是 tee 的（0），
        # go test 的失败会被吃掉，红的 run 会变绿。
        run: |
          set -o pipefail
          go test -race ./... -count=1 2>&1 | tee race-test.log

      - name: 竞态失败详情（哪条用例 / 哪个包 / 断言原文）
        # step 一红，后面默认的 run: 不会执行 ⇒ 必须显式 if:。
        # failure() 覆盖"前面任何一步红了"；cancelled() 让被取消/超时的 run 也留下现场。
        # 日志不在（例如第 3 步 gofmt 就红了）时，明说没有日志，不冒充结论。
        #
        # 为什么是这个顺序：实测（run 37105610892）三条通道里
        #   · check-run 的 output.summary/text 永远是 null ⇒ $GITHUB_STEP_SUMMARY 匿名读不到
        #   · artifact 列表匿名可读，但下载 zip 是 401 Requirements authentication
        #   · 注解（annotations API / job 页 HTML）匿名可读 ✓
        # ⇒ 注解是唯一"带内容"的匿名通道，所以本文件的开头 200 行同时就是注解正文：
        #   用例名、失败的包、日志收尾必须排在前面，又长又啰嗦的竞态调用栈排最后。
        if: failure() || cancelled()
        run: |
          log=race-test.log
          out=race-failure-summary.txt
          {
            echo "## go test -race 失败详情"
            echo ""
            echo "- 提交：${GITHUB_SHA}（run ${GITHUB_RUN_ID} / 第 ${GITHUB_RUN_ATTEMPT} 次尝试）"
            if [ -f "$log" ]; then
              fails=$(grep -cE '^--- FAIL|^[[:space:]]+--- FAIL' "$log" || true)
              races=$(grep -c 'WARNING: DATA RACE' "$log" || true)
              pkgs=$(grep '^FAIL[[:space:]]' "$log" | awk '{print $2}' | tr '\n' ' ' || true)
              echo "- 原始日志 $(wc -l < "$log") 行；失败用例 ${fails:-?} 条；竞态报告 ${races:-?} 处；失败的包：${pkgs:-（没有包级 FAIL 行）}"
              # 这一行是给"到底是不是真竞态"这个第一问题用的：-race 红有两种完全不同的原因。
              if [ "${races:-0}" -gt 0 ]; then
                echo "- 竞态报告 ${races} 处 ⇒ 有真 data race（调用栈见 ④）"
              else
                echo "- 竞态报告 0 处 ⇒ 这次红不是 data race，是用例自己失败/超时（-race 只是拖慢了机器）"
              fi
              echo "- 完整原文：artifact race-test-log；本文件前 200 行即注解正文"
            fi
            echo ""
            if [ ! -f "$log" ]; then
              echo "第 5 步没有留下日志：失败发生在它之前，或它根本没被调度。"
              echo "请回看这一步之前哪个 step 红了（本文件不含 go test 输出）。"
            else
              echo "### ① 失败用例 / 失败的包 / 触发点（逐字摘自 go test 原文，带行号）"
              echo ""
              echo '```'
              # 说明：go test 打印的断言行是缩进的（"    xxx_test.go:88: ..."），
              # 所以 _test.go / testing.go 两个模式都允许前导空格。
              grep -nE '^--- FAIL|^[[:space:]]+--- FAIL|^WARNING: DATA RACE|^FAIL[[:space:]]|^[[:space:]]*[^[:space:]]+_test\.go:[0-9]+:|^[[:space:]]+testing\.go:[0-9]+:' "$log" | head -n 60 || true
              echo '```'
              echo ""
              echo "### ② 各包结论（哪几个包是 FAIL / ok）"
              echo ""
              echo '```'
              grep -E '^(FAIL|ok|\?)[[:space:]]' "$log" | head -n 40 || true
              echo '```'
              echo ""
              echo "### ③ 原始日志末尾 40 行（收尾 / 兜底）"
              echo ""
              echo '```'
              tail -n 40 "$log"
              echo '```'
              echo ""
              echo "### ④ 失败用例块 + 竞态报告块（含调用栈，可能较长）"
              echo ""
              echo '```'
              awk '
                /WARNING: DATA RACE/ { show = 45 }
                /^--- FAIL|^[[:space:]]+--- FAIL/ { show = 25 }
                show > 0 { print; show-- }
              ' "$log" | head -n 300
              echo '```'
            fi
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

          # 走注解通道：annotations API 与 job 页 HTML 都是未认证可读的（已实测）。
          # 换行必须转义成 %0A，否则 runner 只取第一行；% 要先转成 %25。
          # 200 行 ≈ 十几 KB，远低于"单条注解 65535 字符"的上限。
          cap=200
          msg="$(head -n "$cap" "$out" | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/\r/,""); if (NR>1) printf "%%0A"; printf "%s", $0}')"
          total=$(wc -l < "$out")
          if [ "$total" -gt "$cap" ]; then
            msg="${msg}%0A%0A（注解只含摘要前 ${cap} 行，全文共 ${total} 行；完整原文见 artifact race-test-log）"
          fi
          echo "::error title=go test -race 失败详情（用例 / 包 / 断言）::${msg}"

      - name: 上传竞态失败日志（完整原文）
        # artifacts 列表（GET /repos/{o}/{r}/actions/runs/{id}/artifacts）未认证可读：
        # "有没有失败日志、叫什么名字"不登录也能确认（下载 zip 需要认证）。
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: race-test-log
          path: |
            race-test.log
            race-failure-summary.txt
          # 前面的步骤没留下文件时不要因为"没有文件"再红一次（详情缺失已经由注解说清了）。
          if-no-files-found: warn
          retention-days: 14

      - name: 漏洞扫描（依赖 + 标准库）
        # always()：这道闸门不该因为前一步红了就被跳过 —— 之前 14 个红 run 里它全是
        # skipped，等于发布版上从没真正跑过安全扫描。
        # 但不是无条件跑：checkout 失败时没有源码可扫，setup-go 失败时没有 go 可用，
        # 硬跑只会把无关报错混进结论（那才是误报）。所以钉住这两个前置条件都成功。
        if: always() && steps.checkout.outcome == 'success' && steps.setup-go.outcome == 'success'
        # 版本钉住以保证可复现；漏洞库运行时从 vuln.go.dev 取，新条目照样能发现。
        # 本地等价命令：make vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
